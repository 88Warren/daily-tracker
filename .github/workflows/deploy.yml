name: Build & Deploy Tracker

# ── Trigger: push a version tag e.g. git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

# ── Repo-specific config ──────────────────────────────────────────────────────
env:
  IMAGE_NAME:  lmwcode/tracker
  HEALTH_URL:  https://tracker.lmwrecovery.co.uk/api/health

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Quality checks (type-check, lint, tests)
  # ────────────────────────────────────────────────────────────────────────────
  check:
    name: Type-check, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check client
        run: npx tsc --noEmit
        working-directory: client

      - name: Type-check server
        run: npx tsc --noEmit
        working-directory: server

      - name: Run server tests
        run: npm test
        working-directory: server

      - name: Build verification (client)
        run: npm run build
        working-directory: client

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build image, scan, push, deploy (only if checks pass)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Build → Scan → Push → Deploy
    runs-on: ubuntu-latest
    needs: check

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Extract version tag ────────────────────────────────────────────────
      - name: Set image tag
        id: tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # ── 3. Set up QEMU + buildx for multi-arch ────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── 4. Login to Docker Hub ────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── 5. Build image locally for scanning (amd64 only, no push yet) ─────────
      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan

      # ── 6. Security scan with Trivy ───────────────────────────────────────────
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      # ── 7. Build & push multi-arch image ──────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest

      # ── 8. Deploy to VPS via SSH ──────────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            helm upgrade --install tracker-release \
              /opt/lmwrecovery/lmwrecovery-helmcharts/tracker \
              --namespace lmw-recovery \
              -f /opt/lmwrecovery/lmwrecovery-helmcharts/tracker/secrets.prod.yaml \
              --set app.image.tag=${{ steps.tag.outputs.VERSION }} \
              --reuse-values

      # ── 9. Post-deploy health check ───────────────────────────────────────────
      - name: Wait for rollout
        run: sleep 30

      - name: Health check
        run: |
          echo "Running health check against ${{ env.HEALTH_URL }}..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 --retry 3 --retry-delay 5 \
            ${{ env.HEALTH_URL }} 2>&1) || STATUS="curl_error_$?"
          echo "Health check status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed"
          else
            echo "⚠️  Health check returned: $STATUS"
            echo "The deploy completed — check the app manually."
          fi

      # ── 10. Summary ───────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "### ✅ Deployed ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | \`${{ env.HEALTH_URL }}\` |" >> $GITHUB_STEP_SUMMARY
